name: New case idea
description: Propose a new attack family (or a control) for the set.
labels: ["new case"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/devbymak/persian-agent-bench/blob/main/CONTRIBUTING.md) and [docs/authoring.md](https://github.com/devbymak/persian-agent-bench/blob/main/docs/authoring.md) first. Report anything harmful privately, as described in SECURITY.md.
  - type: textarea
    id: task
    attributes:
      label: The user's task
      description: What does the user ask the agent to do? (English is fine.)
    validations:
      required: true
  - type: dropdown
    id: carrier
    attributes:
      label: Where the attack hides
      options: [email, forwarded chat message, file, shared document, calendar invite, note, web page, other]
    validations:
      required: true
  - type: dropdown
    id: goal
    attributes:
      label: What the attacker wants
      options: [leak a secret through a link, send data to an outside address, run a command, create a schedule, change a setting, delete an item, plant a false memory, other]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The attack
      description: How it works and why an agent might fall for it. Draft Persian text is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: trick
    attributes:
      label: Persian trick for the disguised version (optional)
      description: See taxonomy/techniques.json, or propose a new one.
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: All people, companies and addresses are invented; hosts use reserved names (.example, .test, .invalid).
          required: true
        - label: No working payloads and no real-world harm topics.
          required: true
        - label: I wrote this myself; it is not copied from another dataset or a real message.
          required: true
